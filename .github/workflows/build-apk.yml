name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Unit Ready 360 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Initialize Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Copy & Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./unit-ready-360.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unit-ready-360-apk
          path: ./unit-ready-360.apk
          retention-days: 90

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: latest
          name: "UNIT-READY 360 Android APK (Latest)"
          body: |
            ### 📱 UNIT-READY 360 Android APK Release
            
            This is the latest automated build of the **UNIT-READY 360** offline application for Android.
            
            - **Download:** Click `unit-ready-360.apk` below to download and install.
            - **Offline Database:** Fully persistent IndexedDB storage.
          files: ./unit-ready-360.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
