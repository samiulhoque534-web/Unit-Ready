<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B5E2B" />
      <stop offset="100%" stop-color="#1E3316" />
    </linearGradient>
  </defs>
  <!-- Base Shield -->
  <polygon points="50,5 90,20 90,60 50,95 10,60 10,20" fill="url(#shieldGrad)" stroke="#D97706" stroke-width="4" stroke-linejoin="round" />
  <!-- Inner Ring for 360 -->
  <circle cx="50" cy="50" r="28" fill="none" stroke="#F8F9F5" stroke-width="2.5" stroke-dasharray="6,3" opacity="0.8" />
  <!-- Central Insignia Star -->
  <polygon points="50,30 54,42 67,42 56,50 60,63 50,55 40,63 44,50 33,42 46,42" fill="#F59E0B" stroke="#B45309" stroke-width="1" />
  <!-- Bottom 360 text -->
  <text x="50" y="78" font-family="'Inter', sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">360</text>
</svg>
